name: Terminal stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terminal-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upstream action ships no built dist/ — build from source and run the CLI.
      # The CLI reads .github-stats-config.json (theme/commands) and
      # assets/github_art.txt (the octocat logo) from the working directory.
      # The patch makes the neofetch fields read from the config (neofetchInfo)
      # and turns keys starting with "_" into blank separator rows.
      - name: Build and run github-stats-terminal-style
        env:
          GHT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://github.com/yogeshwaran01/github-stats-terminal-style.git /tmp/gsts
          git -C /tmp/gsts checkout --quiet 35fe5974c9bf6aaf4a37251d04ae6c3cbb703e0b
          git -C /tmp/gsts apply "$GITHUB_WORKSPACE/patches/gsts-neofetch-config.patch"
          npm --prefix /tmp/gsts ci
          npm --prefix /tmp/gsts run build
          node /tmp/gsts/dist/bin/github-stats-terminal.js MrTorriz

      # Remap the github theme palette to black and white:
      # light variant = black text/cat on white, dark = white on dark.
      - name: Build black-and-white light/dark variants
        run: |
          # animation-iteration-count infinite -> 1 + freeze: the card types ONCE,
          # then stays fully readable (no loop that wipes the content away).
          # Lives in the light sed; dark is derived from terminal_light.svg.
          sed \
            -e 's/animation-iteration-count:infinite/animation-iteration-count:1;animation-fill-mode:forwards/' \
            -e 's/rgb(111,66,193)/#24292e/g' \
            -e 's/rgb(5,152,188)/#24292e/g' \
            -e 's/rgb(40,167,69)/#24292e/g' \
            -e 's/rgb(215,58,73)/#24292e/g' \
            -e 's/rgb(3,102,214)/#24292e/g' \
            -e 's/rgb(219,171,9)/#57606a/g' \
            -e 's/rgb(106,115,125)/#57606a/g' \
            -e 's|<rect width="840" \([^>]*\)class="a">|<rect width="840" \1class="a" stroke="#d0d7de" stroke-width="1">|' \
            github_stats.svg > terminal_light.svg
          sed \
            -e 's/rgb(36,41,46)/#e6edf3/g' \
            -e 's/#24292e/#e6edf3/g' \
            -e 's/#57606a/#8b949e/g' \
            -e 's/rgb(255,255,255)/#161b22/g' \
            -e 's/#d0d7de/#30363d/g' \
            terminal_light.svg > terminal_dark.svg
          rm github_stats.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terminal_light.svg terminal_dark.svg
          git diff --staged --quiet || (git commit -m "chore: refresh terminal card" && git push)
